<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinaesthetic AI - game overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <main class="overlay-root" aria-label="Kinaesthetic AI live overlay">
      <section class="hud" id="hud">
        <div class="hud-top">
          <span class="status-dot"></span>
          <span id="statusText">Kinaesthetic AI offline</span>
          <span class="hud-mode" id="sourceBadge">offline</span>
        </div>
        <div class="risk-row">
          <span>Tilt risk</span>
          <strong id="tiltRisk">--</strong>
        </div>
        <div class="meter"><span id="tiltBar" style="width: 0%"></span></div>
        <div class="mini-grid">
          <div><span>Readiness</span><strong id="readiness">--</strong></div>
          <div><span>Recovery</span><strong id="recovery">--</strong></div>
          <div><span>Jaw</span><strong id="jawTension">--</strong></div>
          <div><span>Shoulders</span><strong id="shoulderTension">--</strong></div>
        </div>
        <div class="alert" id="recommendation">Open /play and start camera</div>
        <div class="confidence">Signal <span id="confidence">--</span></div>
        <button class="voice-unlock" id="voiceUnlock" type="button">Enable voice</button>
        <div class="label-flash" id="labelFlash" hidden>Label saved</div>
      </section>
    </main>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
